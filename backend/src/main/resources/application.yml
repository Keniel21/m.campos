spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/mcampos}
    username: ${DB_USER:mcampos}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
server:
  port: 8080
  error:
    include-message: never
app:
  jwt-secret: ${JWT_SECRET}
  admin-email: ${ADMIN_EMAIL:admin@mcampos.local}
  admin-password: ${ADMIN_PASSWORD}
  import-directory: ${IMPORT_DIRECTORY:}
logging:
  structured:
    format:
      console: ecs
