services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: mcampos
      POSTGRES_USER: mcampos
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mcampos -d mcampos"]
      interval: 5s
      timeout: 3s
      retries: 20
  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/mcampos
      DB_USER: mcampos
      DB_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET com pelo menos 32 bytes}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@mcampos.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Defina ADMIN_PASSWORD com pelo menos 12 caracteres}
      IMPORT_DIRECTORY: ${IMPORT_DIRECTORY:-}
    volumes:
      - ./database:/legacy-data:ro
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      - backend
volumes:
  postgres-data:
